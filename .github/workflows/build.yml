name: Build

# Builds the NuGet package and the Gallery and keeps them as run artifacts; nothing is published (see release.yml).
# Pull requests wait for a maintainer to approve the pr-build environment first; v* tags build right away.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the older run that is still waiting for approval.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: pr-build  # the required reviewers on this environment are the approval gate
    steps:
      - run: echo "Approved"

  build:
    needs: approve
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Choose version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') { $arg = "-p:Version=$($env:GITHUB_REF_NAME.Substring(1))" }
          else { $arg = "-p:VersionSuffix=ci.$env:GITHUB_RUN_NUMBER" }
          "VERSION_ARG=$arg" >> $env:GITHUB_ENV

      - name: Build solution
        shell: pwsh
        run: >-
          msbuild iNKORE.UI.WPF.Modern.sln -restore
          -p:Configuration=Release "-p:Platform=Any CPU" -p:ContinuousIntegrationBuild=true $env:VERSION_ARG

      - name: Pack
        shell: pwsh
        run: >-
          msbuild source/iNKORE.UI.WPF.Modern.Controls/iNKORE.UI.WPF.Modern.Controls.csproj -t:Pack -p:NoBuild=true
          -p:Configuration=Release -p:ContinuousIntegrationBuild=true $env:VERSION_ARG

      - name: Zip Gallery
        shell: pwsh
        run: |
          $version = (Get-Item .nuget/iNKORE.UI.WPF.Modern.*.nupkg).BaseName.Substring('iNKORE.UI.WPF.Modern.'.Length)
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path source/iNKORE.UI.WPF.Modern.Gallery/bin/Release/net6.0-windows10.0.18362.0/* `
            -DestinationPath "artifacts/iNKORE.UI.WPF.Modern.Gallery@$version.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: .nuget/*.nupkg
          include-hidden-files: true  # .nuget/ is a dot folder, which upload-artifact skips by default
          if-no-files-found: error

      - name: Upload Gallery
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: artifacts/*.zip
          compression-level: 0  # already zipped
          if-no-files-found: error
