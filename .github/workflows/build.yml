name: Build

# Builds the solution and the NuGet package for every PR and push to main; nothing is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION_SUFFIX: ci.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: >-
          msbuild iNKORE.UI.WPF.Modern.sln -restore
          -p:Configuration=Release "-p:Platform=Any CPU" "-p:VersionSuffix=$env:VERSION_SUFFIX"

      - name: Pack
        shell: pwsh
        run: >-
          msbuild source/iNKORE.UI.WPF.Modern.Controls/iNKORE.UI.WPF.Modern.Controls.csproj -t:Pack -p:NoBuild=true
          -p:Configuration=Release "-p:VersionSuffix=$env:VERSION_SUFFIX"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: .nuget/*.nupkg
          include-hidden-files: true  # .nuget/ is a dot folder, which upload-artifact skips by default
          if-no-files-found: error

      - name: Upload Gallery
        uses: actions/upload-artifact@v4
        with:
          name: iNKORE.UI.WPF.Modern.Gallery
          path: source/iNKORE.UI.WPF.Modern.Gallery/bin/Release/net6.0-windows10.0.18362.0
