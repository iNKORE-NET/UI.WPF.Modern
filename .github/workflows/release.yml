name: Release

# Pushing a tag such as v0.10.3 builds that version right away (build.yml);
# publishing it waits for approval on the nuget environment.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget  # the required reviewers on this environment approve every release
    permissions:
      contents: write  # gh release create
      id-token: write  # NuGet trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" *.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
